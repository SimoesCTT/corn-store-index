<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corn Store — FOSS Android App Index</title>
<meta name="description" content="A daily-updated index of free and open-source Android apps distributed via GitHub Releases. No accounts, no ads, no tracking.">
<link rel="icon" href="corn.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <header class="site" id="header-top">
    <div class="title-row">
      <h1>Corn Store</h1>
      <a class="btn-paper" href="whitepaper.html">White paper</a>
    </div>
    <p class="tagline">A daily-updated index of free and open-source Android apps. No accounts, no ads, no tracking.</p>
    <div class="stats" id="stats"></div>
  </header>

  <div class="controls" id="controls">
    <input id="search" class="search" type="search" placeholder="Search apps, packages, topics…" autocomplete="off" spellcheck="false">
    <select id="sort" class="sort">
      <option value="recent">Recently updated</option>
      <option value="name">Name (A–Z)</option>
      <option value="downloads">Most downloads</option>
      <option value="stars">Most stars</option>
    </select>
  </div>

  <div class="chips" id="chips"></div>

  <div class="apps" id="apps">
    <div class="empty">Loading…</div>
  </div>

  <footer class="site">
    <span>
      <a href="about.html">About</a> ·
      <a href="submit.html">Submit an app</a> ·
      <a href="whitepaper.html">White paper</a> ·
      <a href="contact.html">Contact</a> ·
      <a href="privacy.html">Privacy</a> ·
      <a href="terms.html">Terms</a> ·
      <a href="license.html">License</a> ·
      <a href="https://github.com/SimoesCTT/corn-store-index">Source</a>
    </span>
    <span>GPL-3.0-or-later</span>
  </footer>

</div>
<script src="app.js"></script>
</body>
</html>
