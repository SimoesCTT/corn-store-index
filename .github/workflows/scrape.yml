name: Daily scrape

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aapt unzip wget
          mkdir -p $HOME/android-tools
          cd $HOME/android-tools
          wget -q https://dl.google.com/android/repository/build-tools_r34-linux.zip
          unzip -q build-tools_r34-linux.zip
          ls -la $HOME/android-tools/

      - name: Locate aapt2 and apksigner
        run: |
          echo "AAPT2=$(find $HOME/android-tools -name aapt2 -type f | head -1)" >> $GITHUB_ENV
          echo "APKSIGNER=$(find $HOME/android-tools -name apksigner -type f | head -1)" >> $GITHUB_ENV

      - name: Run scraper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scraper/scrape.py

      - name: Generate Komi-format mirror files
        run: python3 scraper/to_komi_format.py

      - name: Commit updated index
        run: |
          git config user.name "corn-store-bot"
          git config user.email "bot@corn-store.local"
          git add docs/index.json docs/cached-data
          if git diff --staged --quiet; then
            echo "No changes to index"
          else
            git commit -m "Update index ($(date -u +%Y-%m-%d))"
            git push
          fi
